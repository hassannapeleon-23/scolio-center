<style>
/* Layout: RTL admin shell. Collapsible sidebar at the inline-start, sticky top bar with global search, one content column. */
:root{
  --navy:#3C408E; --teal:#67C4D9;
  --bg:#F1F3FA; --surface:#FFFFFF; --surface-2:#F6F7FC; --ink:#1F2347; --muted:#565D80;
  --line:#DFE2F0; --line-strong:#C3C8E0;
  --accent:#3C408E; --accent-ink:#FFFFFF; --accent-soft:#E3F5FA; --accent-2:#67C4D9; --head:#3C408E; --nav-on:#E8EAF8;
  --ok:#17744A; --ok-bg:#E1F3E9; --warn:#8F5A0E; --warn-bg:#FAEFD6; --bad:#B0261D; --bad-bg:#FBE5E2;
  --free:#3C408E; --free-bg:#E7E9F8; --shadow:0 1px 2px rgba(60,64,142,.07),0 10px 30px rgba(60,64,142,.10);
  --f-display:'Cairo','Tajawal',system-ui,sans-serif; --f-body:'Tajawal','Cairo',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --navy:#AEB3F2; --teal:#67C4D9;
  --bg:#0D1024; --surface:#151935; --surface-2:#1B2041; --ink:#E7E9F8; --muted:#A3A9CC;
  --line:#272C57; --line-strong:#3A4180;
  --accent:#67C4D9; --accent-ink:#06222B; --accent-soft:#13303D; --accent-2:#2C7C90; --head:#C5C9F7; --nav-on:#222859;
  --ok:#5FD08F; --ok-bg:#163021; --warn:#E8B45C; --warn-bg:#352A12; --bad:#FF8A80; --bad-bg:#3A1A18;
  --free:#AEB3F2; --free-bg:#232954; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --navy:#AEB3F2; --teal:#67C4D9;
  --bg:#0D1024; --surface:#151935; --surface-2:#1B2041; --ink:#E7E9F8; --muted:#A3A9CC;
  --line:#272C57; --line-strong:#3A4180;
  --accent:#67C4D9; --accent-ink:#06222B; --accent-soft:#13303D; --accent-2:#2C7C90; --head:#C5C9F7; --nav-on:#222859;
  --ok:#5FD08F; --ok-bg:#163021; --warn:#E8B45C; --warn-bg:#352A12; --bad:#FF8A80; --bad-bg:#3A1A18;
  --free:#AEB3F2; --free-bg:#232954; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark}

*{box-sizing:border-box}
body{font-family:var(--f-body);font-size:15px;line-height:1.6;background:var(--bg);color:var(--ink);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:70;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.3;color:var(--head)}
h1{font-size:24px;font-weight:800} h2{font-size:18px;font-weight:700} h3{font-size:15px;font-weight:700}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.ic{flex:none;display:inline-block;vertical-align:middle}
.n{display:inline-block;direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .sm-t{font-size:13px}

/* shell */
.app{display:flex;gap:18px;align-items:flex-start;max-width:1480px;margin-inline:auto;padding-block:12px}
.side{position:sticky;top:calc(12px + env(safe-area-inset-top,0px));width:236px;flex:none;background:var(--surface);
  border:1px solid var(--line);border-radius:14px;padding:14px 10px;height:calc(100vh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:6px;overflow:hidden;transition:width .15s ease}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}

.brand b{font-family:var(--f-display);font-size:16px;white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:12px;line-height:1.2;white-space:nowrap}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:transparent;border-radius:9px;cursor:pointer;text-align:start;color:var(--muted);font-weight:500}
.nav span{white-space:nowrap}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav[aria-current="page"]{background:var(--nav-on);color:var(--head);font-weight:700;box-shadow:inset -3px 0 0 var(--teal)}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:8px;border-top:1px solid var(--line);white-space:nowrap}
.app.collapsed .side{width:66px}
.app.collapsed .nav span,.app.collapsed .brand div,.app.collapsed .side-foot{display:none}
.app.collapsed .nav{justify-content:center}
.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px}
.top{position:sticky;top:calc(8px + env(safe-area-inset-top,0px));z-index:20;display:flex;align-items:center;gap:10px;background:var(--surface);
  border:1px solid var(--line);border-radius:14px;padding:8px 10px;box-shadow:0 1px 2px rgba(60,64,142,.06)}
.top .ttl{font-family:var(--f-display);font-weight:800;font-size:17px;white-space:nowrap}
.gsearch{flex:1;min-width:0;max-width:520px;margin-inline-start:auto}
.scrim{display:none}
main{display:flex;flex-direction:column;gap:16px;min-width:0}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);
  border-radius:9px;padding:7px 13px;font-weight:700;cursor:pointer;white-space:nowrap;min-height:38px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger:hover{background:var(--bad-bg)}
.btn.danger.solid{background:var(--bad);color:#fff}
.btn.sm{padding:3px 10px;min-height:30px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.dim{opacity:.55}
.ib{display:inline-grid;place-items:center;width:32px;height:32px;border:1px solid transparent;background:transparent;border-radius:8px;cursor:pointer;color:var(--muted)}
.ib:hover{background:var(--surface-2);color:var(--ink)}
.ib.del:hover{color:var(--bad);background:var(--bad-bg)}
.ib[disabled]{opacity:.35;cursor:not-allowed}
.link{border:0;background:none;padding:0;cursor:pointer;color:var(--ink);font-weight:700;text-align:start}
.link:hover{color:var(--head);text-decoration:underline}
.inp,.sel,.ta{width:100%;border:1px solid var(--line-strong);background:var(--surface);border-radius:9px;padding:8px 11px;min-height:40px}
.ta{min-height:76px;resize:vertical}
.inp:focus,.sel:focus,.ta:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.search{position:relative;display:flex;align-items:center}
.search .ic{position:absolute;inset-inline-start:12px;color:var(--muted);pointer-events:none}
.search .inp{padding-inline-start:38px;padding-inline-end:38px}
.search .clr{position:absolute;inset-inline-end:6px}
.search.big .inp{min-height:48px;font-size:16px;border-width:2px}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);cursor:pointer}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:900px){
  .app{gap:0}
  .side{position:fixed;z-index:65;inset-block:0;inset-inline-start:0;top:0;height:100%;width:min(280px,86vw);border-radius:0;transform:translateX(105%);transition:transform .18s ease;
    padding:calc(14px + env(safe-area-inset-top,0px)) 12px calc(14px + env(safe-area-inset-bottom,0px)) calc(12px + env(safe-area-inset-right,0px))}

  .brow{grid-template-columns:90px 1fr auto}
}

<script>
(function(){
try{document.documentElement.setAttribute('dir','rtl');document.documentElement.setAttribute('lang','ar');}catch(e){}
'use strict';
/* =====================================================================
   CORE: data model, calculations and actions (no DOM here)
   Entities: doctors, absences, packages, patients (central), purchases (price snapshot),
   appointments (scheduled vs treating doctor), sessions (one per completed attendance),
   ledger (patient payments / refunds / reversals), payouts (to doctors), audit.
   ===================================================================== */
const KEY='tc_state_v3_excel',KEY_OLD='tc_state_v1_unused';let ACTOR='النظام';
const NAMES_M=['محمد','علي','إبراهيم','حسام','كريم','طارق','هشام','ياسر','مازن','زياد','آدم','رامي','وليد','شادي','أيمن','باسم','تامر','عادل','فادي','ماجد','نبيل','سامح','خالد','أسامة','بلال','حمزة','جابر','سيف','صبري','عمرو','فارس','لؤي','معاذ','نادر','هاني','وائل','يحيى','أنس','إيهاب','جلال','رضا','شريف','عماد','مجدي'];
const NAMES_F=['فاطمة','هدى','ليلى','منى','رنا','دينا','سلمى','نادية','هالة','رحاب','إيمان','شيماء','أميرة','ياسمين','جيهان','لمياء','ريم','هبة','عبير','سماح','داليا','نهى','رشا','مي','ندى','أسماء','بسمة','تقى','جميلة','حنان','خلود','دعاء','رباب','زينب','سهير','صفاء','عفاف','غادة','كوثر','لبنى','مروة','ميار','نجلاء','وفاء'];
const FATHERS=['سعيد','حسين','فتحي','رمضان','صلاح','جمال','عصام','سمير','نصر','عاطف','حمدي','سيد','فؤاد','لطفي','منصور','شعبان','كمال','رفعت','بدر','زكريا','عزت','أنور','ناصر','إسماعيل','عوض','شوقي','مرسي','عبد الله','عبد العزيز','عثمان','يونس','طه','درويش','مختار'];
const FAMILIES=['الشريف','النجار','البنا','العطار','الحداد','المصري','الجندي','فرج','حجازي','سلامة','عيسى','عبد الحميد','رزق','غانم','زيدان','الصاوي','البدري','القاضي','الجمال','الدسوقي'];
const DOCTOR_NAMES=['د. أحمد محمود','د. سارة محمد','د. عمر خالد','د. مريم إبراهيم','د. يوسف علي','د. نورهان حسن','د. مصطفى عبد الرحمن','د. آية مصطفى'];
const DEFAULT_PACKAGES=[{name:'باقة علاج',sessions:12,price:0}];
const METHODS=['نقدًا','تحويل بنكي','فودافون كاش','إنستاباي','بطاقة'];
const NOTES=['يحتاج متابعة أسبوعية','تم الاتفاق على خطة علاجية','يفضل المواعيد المسائية','محوّل من طبيب آخر','حالة مستقرة','يرجى التذكير قبل الجلسة بيوم','يحضر مع أحد أفراد الأسرة'];
const WD=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const WEEK_ORDER=[6,0,1,2,3,4,5];
const APP_L={scheduled:'لم يُسجَّل بعد',attended:'حضر',missed:'لم يحضر',cancelled:'محذوف'};
const CAT_L={package:'باقة كاملة',persession:'دفع بالجلسة',free:'مجاني'};
const CAT_LP={package:'الباقات الكاملة',persession:'الدفع بالجلسة',free:'الحالات المجانية'};
const PSTAT_L={paid:'مدفوع',partial:'مدفوع جزئياً',unpaid:'غير مدفوع',free:'مجاني',refunded:'مُسترد',none:'لا مستحقات'};
const PAT_L={active:'نشط',paused:'متوقف مؤقتاً',archived:'مؤرشف'};
const TX_L={payment:'دفعة',refund:'استرداد',reversal:'عكس / تصحيح',session:'جلسة منفذة',free:'جلسة مجانية'};

/* ---------- helpers ---------- */
const pad=n=>String(n).padStart(2,'0');
const round2=n=>Math.round((n+Number.EPSILON)*100)/100;
function num(x){const v=parseFloat(x);return isFinite(v)?v:0}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseISO(s){const p=String(s).split('-');return new Date(+p[0],(+p[1])-1,+p[2])}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function addDaysS(s,n){return iso(addDays(parseISO(s),n))}
function todayISO(){return iso(new Date())}
function daysBetween(a,b){return Math.round((parseISO(b)-parseISO(a))/86400000)}
function weekday(s){return parseISO(s).getDay()}
function startOfWeek(s){const d=parseISO(s);return iso(addDays(d,-((d.getDay()+1)%7)))}
function toMin(t){const p=String(t).split(':');return (+p[0])*60+(+p[1]||0)}
function fromMin(n){return pad(Math.floor(n/60))+':'+pad(n%60)}
function validTime(t){return /^([01]\d|2[0-3]):[0-5]\d$/.test(String(t))}
function validDate(s){return /^\d{4}-\d{2}-\d{2}$/.test(String(s))&&!isNaN(parseISO(s))}
function nowISO(){return new Date().toISOString()}
function nowLocal(){const d=new Date();return iso(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function norm(s){return String(s||'').toLowerCase().replace(/[ً-ٰٟـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').trim()}
function digitsOnly(s){return String(s||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\D/g,'')}
function csvEsc(v){if(typeof v==='number')return String(v);v=String(v==null?'':v);if(/^[=+\-@]/.test(v))v="'"+v;return /[",\n\r\t]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function toCSV(rows){return rows.map(r=>r.map(csvEsc).join(',')).join('\r\n')}
function toTSV(rows){return rows.map(r=>r.map(v=>String(v==null?'':v).replace(/[\t\r\n]+/g,' ')).join('\t')).join('\r\n')}

/* ---------- state ---------- */
let S=null,IDX=null;
function lzC(s){const B=0xD800,M=0xF7FF;const d=new Map();let nx=B,w='',o=[];
 const code=x=>x.length===1?x.charCodeAt(0):d.get(x);const em=x=>{const c=code(x);o.push(String.fromCharCode(c<B?c:c+0x800))};
 for(let i=0;i<s.length;i++){const ch=s[i];if(w===''){w=ch;continue}const wc=w+ch;if(d.has(wc))w=wc;else{em(w);if(nx>M){d.clear();nx=B}else d.set(wc,nx++);w=ch}}
 if(w!=='')em(w);return o.join('')}
function lzD(z){const B=0xD800,M=0xF7FF;let d=[],nx=B,prev=null,o=[];
 for(let i=0;i<z.length;i++){let c=z.charCodeAt(i);if(c>=0xE000)c-=0x800;let e,rs=false;
  if(prev!==null&&nx>M){d=[];nx=B;rs=true}
  if(c<B)e=String.fromCharCode(c);else{e=d[c-B];if(e===undefined)e=prev+prev[0]}
  if(prev!==null&&!rs){d[nx-B]=prev+e[0];nx++}
  o.push(e);prev=e}
 return o.join('')}

const LS={get(k){try{let v=localStorage.getItem(k);if(v&&v.startsWith('Z1:'))v=lzD(v.slice(3));return v}catch(e){return null}},set(k,v){try{if(v.length>1200000&&!/[\uD800-\uDFFF]/.test(v))v='Z1:'+lzC(v);localStorage.setItem(k,v);return true}catch(e){return false}}};
function defaultSettings(){return{hours:{start:'10:00',end:'22:00'},slot:60,workDays:[6,0,1,2,3,4],rate:0.2,compBasis:'earned',
  free:{mode:'percent',assignedValue:200,fixedAmount:40,costBasis:'comp'}}}
function emptyState(){return{v:2,center:'SCOLIO',settings:defaultSettings(),seq:{},doctors:[],absences:[],packages:[],patients:[],purchases:[],appointments:[],sessions:[],ledger:[],payouts:[],audit:[],expenses:[],exams:[],daily:[],monthly:[],braces:[],docAtt:[]}}
function nid(k){S.seq[k]=(S.seq[k]||0)+1;const n=S.seq[k];
  const f={p:['P-',4],s:['S-',5],t:['T-',5],a:['A-',5],pu:['PU-',4],au:['L-',5],ab:['AB-',3],po:['PO-',4],br:['BR-',4],bp:['BP-',4],da:['DA-',5],pn:['N-',5],d:['d',0],pk:['pk',0]}[k];
  return f[0]+(f[1]?String(n).padStart(f[1],'0'):n)}
function hist(action,detail,reason){return{ts:nowISO(),user:ACTOR,action,detail,reason:reason||''}}
function logA(entity,ref,summary,changes,reason,patientId){S.audit.push({id:nid('au'),ts:nowISO(),user:ACTOR,entity,ref,summary,changes:changes||[],reason:reason||'',patientId:patientId||null})}
let SAVE_OK=true;
function save(){SAVE_OK=LS.set(KEY,JSON.stringify(S));return SAVE_OK}
function commit(){buildIdx();return save()}

/* ---------- index & derived values (single source for every page) ---------- */
function cmpSess(a,b){return a.date<b.date?-1:a.date>b.date?1:a.time<b.time?-1:a.time>b.time?1:a.id<b.id?-1:a.id>b.id?1:0}
function buildIdx(){
  const I={pat:new Map(),doc:new Map(),pur:new Map(),app:new Map(),ses:new Map(),pkg:new Map(),tx:new Map(),
    col:{},patCol:{},patPend:{},used:{},patSes:{},patApps:{},patPur:{},patTx:{},sc:{},bucketSes:{},pd:{},pu:{}};
  for(const p of S.patients){I.pat.set(p.id,p);I.patSes[p.id]=[];I.patApps[p.id]=[];I.patPur[p.id]=[];I.patTx[p.id]=[]}
  for(const d of S.doctors)I.doc.set(d.id,d);
  for(const k of S.packages)I.pkg.set(k.id,k);
  for(const u of S.purchases){I.pur.set(u.id,u);I.used[u.id]=0;if(I.patPur[u.patientId])I.patPur[u.patientId].push(u)}
  for(const t of S.ledger){I.tx.set(t.id,t);if(!I.pat.has(t.patientId))continue;I.patTx[t.patientId].push(t);
    if(t.status==='received'){I.col[t.bucket]=round2((I.col[t.bucket]||0)+t.amount);I.patCol[t.patientId]=round2((I.patCol[t.patientId]||0)+t.amount)}
    else I.patPend[t.patientId]=round2((I.patPend[t.patientId]||0)+t.amount)}
  for(const s of S.sessions){I.ses.set(s.id,s);if(!I.pat.has(s.patientId))continue;I.patSes[s.patientId].push(s);
    if(s.status==='active'){if(s.purchaseId&&I.used[s.purchaseId]!=null)I.used[s.purchaseId]++;(I.bucketSes[s.bucket]=I.bucketSes[s.bucket]||[]).push(s)}}
  for(const a of S.appointments){I.app.set(a.id,a);if(I.patApps[a.patientId])I.patApps[a.patientId].push(a)}
  /* eligible revenue per completed session: FIFO against money actually collected in the same bucket */
  for(const b in I.bucketSes){
    const list=I.bucketSes[b].slice().sort(cmpSess);let rem=Math.max(0,I.col[b]||0);
    for(const s of list){
      if(s.kind==='free'){I.sc[s.id]={kind:'free',eligible:0,doctor:s.comp||0,center:0,cost:s.cost||0,value:s.basis||0,unfunded:0};continue}
      let el;
      if(s.compMode==='earned')el=s.value;else{el=Math.min(s.value,rem);rem=round2(rem-el)}
      el=Math.round(el*1e6)/1e6;const dc=Math.round(el*s.rate*1e6)/1e6;
      I.sc[s.id]={kind:'paid',eligible:el,doctor:dc,center:round2(el-dc),cost:0,value:s.value,unfunded:round2(s.value-el)};
    }
  }
  for(const u of S.purchases){
    const used=I.used[u.id],col=I.col[u.id]||0;
    const due=(u.status==='closed'||u.settled)?Math.max(0,col):u.price;
    I.pu[u.id]={used,remaining:(u.status==='closed'||u.settled)?0:Math.max(0,u.sessions-used),col,due,out:u.settled?0:Math.max(0,round2(due-col))};
  }
  for(const p of S.patients){
    const ses=I.patSes[p.id].filter(s=>s.status==='active'),completed=ses.length,purs=I.patPur[p.id];
    let total=0,remaining=null,due=0,out=0,allClosed=purs.length>0;
    for(const u of purs){const x=I.pu[u.id];due+=x.due;out+=x.out;if(u.status!=='closed')allClosed=false;if(p.category==='package'){total+=(u.status==='closed'||u.settled)?x.used:u.sessions}}
    if(p.category==='package'){remaining=0;for(const u of purs)remaining+=I.pu[u.id].remaining}
    else if(p.category==='free'){total=p.authorized||0;remaining=Math.max(0,total-completed)}
    else{total=completed}
    const ppsDue=round2(ses.filter(s=>s.kind==='pps').reduce((a,s)=>a+s.value,0)),ppsCol=I.col['pps:'+p.id]||0;
    due=round2(due+ppsDue);out=round2(out+(p.assumePaid?0:Math.max(0,ppsDue-ppsCol)));
    const col=I.patCol[p.id]||0;
    let status;
    if(p.category==='free')status='free';
    else if(!purs.length&&ppsDue===0&&col===0)status='none';
    else if(allClosed&&due<=0&&col<=0&&ppsDue===0)status='refunded';
    else if(out<=0)status=(col<=0?'free':'paid');
    else if(col>0)status='partial';
    else status='unpaid';
    I.pd[p.id]={completed,total,remaining,due,collected:col,outstanding:out,status,pending:I.patPend[p.id]||0};
  }
  IDX=I;return I;
}
const pdOf=id=>IDX.pd[id]||{completed:0,total:0,remaining:0,due:0,collected:0,outstanding:0,status:'none',pending:0};
const patById=id=>IDX.pat.get(id);
const hasFak=id=>{const d=IDX.doc.get(id);return !!(d&&d.options&&d.options.indexOf('فك')>=0)};
const docById=id=>IDX.doc.get(id);
const appById=id=>IDX.app.get(id);
const docName=id=>{const d=IDX.doc.get(id);return d?d.name:'—'};
const patName=id=>{const p=IDX.pat.get(id);return p?p.name:'—'};
const activeDoctors=()=>S.doctors.filter(d=>d.active&&!d.examOnly);
function sessionsOfPatient(id){return(IDX.patSes[id]||[]).slice().sort(cmpSess)}
function appsOfPatient(id){return(IDX.patApps[id]||[]).slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.time<b.time?-1:a.time>b.time?1:0)}
function firstApptDate(id){const l=appsOfPatient(id).filter(a=>a.status!=='cancelled');return l.length?l[0].date:null}
function sessionComp(s){const c=IDX.sc[s.id];return c?c:{kind:s.kind==='free'?'free':'paid',eligible:0,doctor:0,center:0,cost:0,value:s.value||0,unfunded:0}}

/* ---------- scheduling ---------- */
function slotsList(from,to,step){const out=[];from=from||S.settings.hours.start;to=to||S.settings.hours.end;step=step||S.settings.slot;for(let m=toMin(from);m+step<=toMin(to);m+=step)out.push(fromMin(m));return out}
function overlaps(m1,d1,m2,d2){return m1<m2+d2&&m2<m1+d1}
function doctorConflicts(doctorId,date,time,dur,excludeId){const m=toMin(time);return S.appointments.filter(a=>a.id!==excludeId&&a.status!=='cancelled'&&a.doctorId===doctorId&&a.date===date&&overlaps(m,dur,toMin(a.time),a.duration))}
function patientConflicts(patientId,date,time,dur,excludeId){const m=toMin(time);return S.appointments.filter(a=>a.id!==excludeId&&a.status!=='cancelled'&&a.patientId===patientId&&a.date===date&&overlaps(m,dur,toMin(a.time),a.duration))}
function absenceAt(doctorId,date,time,dur){
  const m=toMin(time);
  return S.absences.find(ab=>ab.doctorId===doctorId&&ab.date<=date&&date<=(ab.dateTo||ab.date)&&(ab.allDay||overlaps(m,dur,toMin(ab.from),toMin(ab.to)-toMin(ab.from))))||null}
function doctorAvail(doctorId,date,time,dur){
  const d=IDX?IDX.doc.get(doctorId):S.doctors.find(x=>x.id===doctorId);
  if(!d)return{ok:false,reason:'الطبيب غير موجود',kind:'none'};
  if(!d.active)return{ok:false,reason:'الطبيب غير مفعّل',kind:'inactive'};
  const ab=absenceAt(doctorId,date,time,dur);
  if(ab)return{ok:false,reason:'الطبيب غائب'+(ab.reason?' ('+ab.reason+')':''),kind:'absent'};
  if(!d.workDays.includes(weekday(date)))return{ok:false,reason:'خارج أيام عمل الطبيب',kind:'off'};
  const m=toMin(time);if(m<toMin(d.start)||m+dur>toMin(d.end))return{ok:false,reason:'خارج ساعات عمل الطبيب',kind:'hours'};
  return{ok:true};
}
function needsSub(a){return false;if(a.status!=='scheduled')return false;const v=doctorAvail(a.doctorId,a.date,a.time,a.duration);return !v.ok&&(v.kind==='absent'||v.kind==='inactive')}
function checkSchedule(o){
  const errors=[],warnings=[];
  if(!validDate(o.date))errors.push('تاريخ الموعد غير صحيح.');
  if(!validTime(o.time))errors.push('وقت الموعد غير صحيح.');

/* ---------- sessions & attendance ---------- */
function docRate(id){const d=S.doctors.find(x=>x.id===id);return d&&d.rate!=null&&isFinite(d.rate)&&d.rate>=0&&d.rate<=1?d.rate:S.settings.rate}
function freeComp(did){const f=S.settings.free,r=docRate(did);let comp=0;
  if(f.mode==='percent')comp=round2(f.assignedValue*r);else if(f.mode==='fixed')comp=round2(f.fixedAmount);
  let cost=comp;if(f.mode!=='none'&&f.costBasis==='value')cost=Math.max(num(f.assignedValue),comp);
  return{comp,cost,basis:f.assignedValue,mode:f.mode}}
function livePurchaseUse(uid){let n=0;for(const s of S.sessions)if(s.status==='active'&&s.purchaseId===uid)n++;return n}
function pickPurchase(pid){
  const list=S.purchases.filter(u=>u.patientId===pid&&u.status==='active').sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.id<b.id?-1:1);
  for(const u of list)if(livePurchaseUse(u.id)<u.sessions)return u;return null}
function buildSession(p,a,doctorId,date,time,at){
  const s={fak:!!(a&&a.fak&&hasFak(doctorId)),id:nid('s'),patientId:p.id,appointmentId:a?a.id:null,date,time,doctorId,schedDoctorId:a?a.schedDoctorId:doctorId,status:'active',createdAt:at||nowISO(),history:[]};
  if(p.category==='package'){
    const u=pickPurchase(p.id);if(!u)return{error:'لا توجد جلسات متبقية في باقة هذا المريض. سجّل شراء أو تجديد باقة أولاً.'};
    const used=livePurchaseUse(u.id);let value=round2(u.price/u.sessions);
    if(used===u.sessions-1){let prior=0;for(const x of S.sessions)if(x.status==='active'&&x.purchaseId===u.id)prior+=x.value;value=round2(u.price-prior)}
    Object.assign(s,{kind:'package',purchaseId:u.id,bucket:u.id,value,rate:docRate(doctorId),compMode:S.settings.compBasis});
  }else if(p.category==='persession'){
    if(!(p.perSessionPrice>0))return{error:'حدد سعر الجلسة لهذا المريض من بياناته أولاً.'};
    Object.assign(s,{kind:'pps',purchaseId:null,bucket:'pps:'+p.id,value:p.perSessionPrice,rate:docRate(doctorId),compMode:S.settings.compBasis});
  }else{
    const done=S.sessions.filter(x=>x.patientId===p.id&&x.status==='active'&&x.kind==='free').length;
    if(p.authorized>0&&done>=p.authorized)return{error:'اكتملت الجلسات المصرّح بها لهذا المريض ('+p.authorized+'). زد عدد الجلسات المصرّح بها أولاً.'};
    const f=freeComp(doctorId);
    Object.assign(s,{kind:'free',purchaseId:null,bucket:'free:'+p.id,value:0,rate:docRate(doctorId),compMode:S.settings.compBasis,basis:f.basis,freeMode:f.mode,comp:f.comp,cost:f.cost});
  }
  return{session:s};
}

const PFIELDS={name:'الاسم',phone:'الهاتف',doctorId:'الطبيب الأساسي',category:'الفئة',perSessionPrice:'سعر الجلسة',authorized:'الجلسات المصرّح بها',status:'حالة المريض',startDate:'تاريخ بداية المتابعة',notes:'ملاحظات'};
function patientDiff(p,n){

    if(k==='perSessionPrice'||k==='authorized'){from=num(from);to=num(to)}

function updatePatient(id,n,reason,opts){
  const p=S.patients.find(x=>x.id===id);if(!p)return{ok:false,error:'المريض غير موجود.'};
  if(!isFin()&&n&&n.perSessionPrice!==undefined)n=Object.assign({},n,{perSessionPrice:p.perSessionPrice});

  let moved=0,skipped=0;const oldDoc=p.doctorId;

  }

  commit();return{ok:true,moved,skipped,msg:'تم حفظ بيانات المريض.'};

function searchPatients(q,limit){
  const t=norm(q),dg=digitsOnly(q);if(!t&&!dg)return[];
  const out=[];
  for(const p of S.patients){const nm=norm(p.name),code=p.id.toLowerCase();let rank=-1;
    if(code===String(q).trim().toLowerCase())rank=0;else if(nm.startsWith(t))rank=1;else if(nm.includes(t))rank=2;else if(code.includes(String(q).trim().toLowerCase()))rank=3;else if(dg.length>=3&&digitsOnly(p.phone).includes(dg))rank=4;
    if(rank>=0)out.push({p,rank})}
  out.sort((a,b)=>a.rank-b.rank||a.p.name.localeCompare(b.p.name,'ar'));
  return out.slice(0,limit||50).map(x=>x.p);
}

function ledgerRows(f){
  f=f||{};const rows=[];
  const inR=d=>(!f.from||d>=f.from)&&(!f.to||d<=f.to);
  const wantTx=!f.type||f.type==='payment'||f.type==='refund'||f.type==='reversal';
  const wantSes=!f.type||f.type==='session'||f.type==='free';
  if(wantTx)for(const t of S.ledger){const p=IDX.pat.get(t.patientId);if(!p||t.status!=='received')continue;
    if(f.type&&t.type!==f.type)continue;if(!inR(t.date))continue;if(f.patient&&p.id!==f.patient)continue;if(f.doctor&&p.doctorId!==f.doctor)continue;
    const u=IDX.pur.get(t.bucket);if(f.pkg&&(!u||u.packageId!==f.pkg))continue;
    rows.push({kind:'tx',id:t.id,date:t.date,time:'',createdAt:t.createdAt,patientId:p.id,type:t.type,cash:t.amount,basis:null,rate:null,doctorComp:null,center:null,doctorId:null,method:t.method,status:t.reversedBy?'معكوسة':'مستلمة',related:u?u.id+' · '+u.name:'دفع بالجلسة',note:t.note+(t.reason?' · سبب: '+t.reason:'')})}
  if(wantSes)for(const s of S.sessions){if(s.status!=='active')continue;const p=IDX.pat.get(s.patientId);if(!p)continue;
    const isFree=s.kind==='free';if(f.type==='free'&&!isFree)continue;if(f.type==='session'&&isFree)continue;
    if(!inR(s.date))continue;if(f.patient&&p.id!==f.patient)continue;if(f.doctor&&s.doctorId!==f.doctor)continue;
    const u=s.purchaseId?IDX.pur.get(s.purchaseId):null;if(f.pkg&&(!u||u.packageId!==f.pkg))continue;
    const c=sessionComp(s);
    rows.push({kind:'ses',id:s.id,date:s.date,time:s.time,createdAt:s.createdAt,patientId:p.id,type:isFree?'free':'session',cash:0,basis:isFree?s.basis:s.value,rate:s.rate,eligible:c.eligible,doctorComp:c.doctor,center:isFree?-c.cost:c.center,doctorId:s.doctorId,method:'',status:'منفذة',related:(u?u.name:isFree?'جلسة مجانية':'دفع بالجلسة'),note:(s.doctorId!==s.schedDoctorId?'بديل عن '+docName(s.schedDoctorId):'')+(!isFree&&c.unfunded>0?(s.doctorId!==s.schedDoctorId?' · ':'')+'غير مغطّاة بالدفع: '+c.unfunded:'')})}
  rows.sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(a.time<b.time?1:a.time>b.time?-1:0));
  return rows;
}
function sumRows(rows){
  const z={payments:0,refunds:0,reversals:0,netCash:0,eligible:0,paidDoctorComp:0,centerShare:0,freeComp:0,freeCost:0,sessions:0,freeSessions:0};
  for(const r of rows){
    if(r.kind==='tx'){z.netCash+=r.cash;if(r.type==='payment')z.payments+=r.cash;else if(r.type==='refund')z.refunds+=r.cash;else z.reversals+=r.cash}
    else if(r.type==='free'){z.freeComp+=r.doctorComp;z.freeCost+=-r.center;z.freeSessions++}
    else{z.eligible+=r.eligible;z.paidDoctorComp+=r.doctorComp;z.centerShare+=r.center;z.sessions++}
  }
  for(const k in z)z[k]=round2(z[k]);
  z.doctorComp=round2(z.paidDoctorComp+z.freeComp);z.net=round2(z.centerShare-z.freeCost);return z;
}
function payoutsSum(f){f=f||{};let s=0;for(const x of S.payouts){if(x.status!=='active')continue;if(f.doctor&&x.doctorId!==f.doctor)continue;if(f.from&&x.date<f.from)continue;if(f.to&&x.date>f.to)continue;s+=x.amount}return round2(s)}

function finSummary(f){
  f=f||{};const rows=ledgerRows(f),z=sumRows(rows);
  let out=0,unearned=0;
  for(const p of S.patients){if(f.patient&&p.id!==f.patient)continue;if(f.doctor&&p.doctorId!==f.doctor)continue;
    if(f.pkg&&!IDX.patPur[p.id].some(u=>u.packageId===f.pkg))continue;out+=pdOf(p.id).outstanding}
  for(const b in IDX.col){if(b.startsWith('pps:')){const pid=b.slice(4);if(f.patient&&pid!==f.patient)continue;}else{const u=IDX.pur.get(b);if(!u||(f.patient&&u.patientId!==f.patient)||(f.pkg&&u.packageId!==f.pkg))continue}
    const sessVal=(IDX.bucketSes[b]||[]).reduce((a,s)=>a+IDX.sc[s.id].eligible,0);unearned+=Math.max(0,round2((IDX.col[b]||0)-sessVal))}
  z.outstanding=round2(out);z.unearned=round2(unearned);
  z.payoutsPaid=payoutsSum({doctor:f.doctor,from:f.from,to:f.to});
  z.owedAll=round2(doctorCompAll(f.doctor||null)-payoutsSum({doctor:f.doctor}));
  return z;

 {id:'monthpl',fin:true,title:'ملخص شهري: الدخل والمصروفات وأجور الأطباء',filters:['range'],build(f){

   if(!f.from&&!f.to)for(const o of S.monthly||[]){const z=m.get(o.m);if(z){z.cash=o.cash;z.insta=o.insta;z.exp=o.exp;z.exam=o.exam;z.official=1}}

    const p={id:newPatientCode(),name:c.name,phone:'',doctorId:c.doctorId,category:c.type,perSessionPrice:c.perSessionPrice||0,authorized:c.type==='free'?(c.totalSessions||0):0,status:'active',startDate:c.startDate||todayISO(),notes:c.notes||'',createdAt:c.startDate||todayISO(),demo:!!c.demo};

  }

    const x=mkTx({patientId:p.id,date:t.date,amount:t.amount,type:t.type==='refund'?'refund':t.type==='reversal'?'reversal':'payment',method:t.method,status:t.status==='received'?'received':'pending',bucket:u?u.id:'pps:'+p.id,purchaseId:u?u.id:null,note:t.note||''});txMap.set(t.id,x)}

  for(const p of S.patients){const d=pdOf(p.id);if(p.status!=='active'||(d.remaining!=null&&d.remaining<=0)||d.status==='refunded')continue;
    const sl=findFreeSlot(p.doctorId,addDaysS(todayISO(),1),14);if(!sl)continue;

function patientFilterList(){
  const f=UI.pat;
  return S.patients.filter(p=>{
    if(p.examOnly&&!f.q)return false;if(UI.view==='archived'){if(p.status!=='archived')return false}else if(p.status==='archived'&&!f.q)return false;
    if(f.q){const q=norm(f.q),raw=String(f.q).trim().toLowerCase();if(!(norm(p.name).includes(q)||p.id.toLowerCase().includes(raw)||(digitsOnly(f.q).length>=3&&digitsOnly(p.phone).includes(digitsOnly(f.q)))))return false}
    if(f.doctor&&p.doctorId!==f.doctor)return false;if(f.cat&&p.category!==f.cat)return false;if(f.status&&p.status!==f.status)return false;
    if(f.pay&&pdOf(p.id).status!==f.pay)return false;return true});
}
function sortPatients(list){
  const k=UI.pat.sort.key,d=UI.pat.sort.dir;
  const val=p=>{const x=pdOf(p.id);switch(k){case'id':return p.id;case'doctor':return docName(p.doctorId);case'category':return CAT_L[p.category];case'completed':return x.completed;case'remaining':return x.remaining==null?1e9:x.remaining;case'pay':return PSTAT_L[x.status];case'outstanding':return x.outstanding;case'status':return PAT_L[p.status];default:return p.name}};
  return list.slice().sort((a,b)=>{const x=val(a),y=val(b);let r=typeof x==='number'?x-y:String(x).localeCompare(String(y),'ar');return r*d||a.name.localeCompare(b.name,'ar')});
}

function submitForm(){
  const sp=UI.form,d=UI.draft;if(!sp)return;
  const errors={};let formErr='',warnings=[];
  for(const f of sp.fields(d)){if(!visible(f,d)||f.type==='html')continue;
    const v=d[f.k];const req=typeof f.req==='function'?f.req(d):f.req;
    if(req&&(f.type==='days'?!(v&&v.length):String(v==null?'':v).trim()===''))errors[f.k]='هذا الحقل مطلوب.';
    else if(f.type==='number'&&String(v).trim()!==''){const n=parseFloat(v);if(!isFinite(n))errors[f.k]='أدخل رقماً صحيحاً.';else if(f.min!=null&&n<f.min)errors[f.k]='القيمة يجب ألا تقل عن '+f.min+'.';else if(f.max!=null&&n>f.max)errors[f.k]='القيمة يجب ألا تزيد عن '+f.max+'.'}}
  if(!Object.keys(errors).length&&sp.validate){const r=sp.validate(d)||{};Object.assign(errors,r.errors||{});formErr=r.formErr||'';warnings=r.warnings||[]}
  UI.errors=errors;UI.formErr=formErr;
  if(Object.keys(errors).length||formErr){UI.ack=false;UI.warn=[];renderModal();if(!formErr&&Object.keys(errors).length){const el=$('.modal .inp.bad,.modal .sel.bad,.modal .ta.bad');if(el)el.focus()}return}
  if(warnings.length&&!(UI.ack&&JSON.stringify(warnings)===JSON.stringify(UI.warn))){UI.warn=warnings;UI.ack=true;renderModal();return}
  const r=sp.onSave(d);
  if(r&&r.error){UI.formErr=r.error;UI.ack=false;UI.warn=[];renderModal();return}
  const msg=r&&r.msg;closeModal();if(msg)toast(msg,r.kind);refresh();
}

function slotOptions(cur){const l=slotsList();if(cur&&!l.includes(cur)){l.push(cur);l.sort()}return l.map(t=>({v:t,l:tfmtT(t)}))}
function openApptForm(o){

  if(edit&&!a)return;
  const p0=edit?patById(a.patientId):(o.patientId?patById(o.patientId):null);
  const draft=edit?{patientId:a.patientId,date:a.date,time:a.time,duration:a.duration,schedDoctorId:a.doctorId,doctorId:a.doctorId,note:a.note||'',status:a.status==='attended'?'scheduled':a.status,attended:a.status==='attended',fak:!!a.fak,reason:'',repeat:1}:
   {patientId:p0?p0.id:'',date:o.date||UI.cal.date||todayISO(),time:o.time||slotsList()[0]||'10:00',duration:S.settings.slot,schedDoctorId:o.doctorId||(p0?p0.doctorId:''),doctorId:o.doctorId||(p0?p0.doctorId:''),note:'',repeat:1,fak:false,touched:!!o.doctorId};
  const wasAtt=edit&&a.status==='attended';
  const changed=d=>edit&&(d.date!==a.date||d.time!==a.time||Number(d.duration)!==a.duration||d.doctorId!==a.doctorId);
  openForm({title:edit?'تفاصيل الموعد وتعديله':'موعد جديد',submit:edit?'حفظ التعديلات':'حجز الموعد',draft,
    fields:d=>[
      edit?{type:'html',html:()=>'<div class="note"><b>'+esc(patName(d.patientId))+'</b><span class="idc">'+d.patientId+'</span> '+badgeA(a.status)+'</div>'}:
        {k:'patientId',label:'المريض (ابحث بالاسم أو الرقم أو الهاتف)',type:'patsearch',req:true,full:true},
      {k:'date',label:'التاريخ',type:'date',req:true},
      {k:'time',label:'الوقت (فترات ثابتة)',type:'select',req:true,options:()=>slotOptions(d.time)},
      {k:'duration',label:'المدة (دقيقة)',type:'number',min:5,step:5,req:true},
      {k:'doctorId',label:'الطبيب',type:'select',req:true,options:()=>activeDoctors().concat(S.doctors.filter(x=>!x.active&&x.id===d.doctorId)).map(x=>{let s='';if(validDate(d.date)&&validTime(d.time)){const v=doctorAvail(x.id,d.date,d.time,Number(d.duration)||60);if(!v.ok)s=' (غير متاح)';else if(doctorConflicts(x.id,d.date,d.time,Number(d.duration)||60,edit?a.id:null).length)s=' (مشغول)'}return{v:x.id,l:x.name+s}})},
      {k:'fak',label:'فك (خيار إضافي)',type:'checkbox',show:dd=>hasFak(dd.doctorId),hint:'يتوفر هذا الخيار لجلسات د. روضه فقط.'},
      edit?{k:'attended',label:'حضر المريض',type:'checkbox',hint:'تسجيل الحضور يُنشئ جلسة واحدة ويحتسب أجر الطبيب الذي قام بالجلسة. إلغاء العلامة يعكس الجلسة بسجل واضح.'}:{k:'repeat',label:'التكرار الأسبوعي (عدد المواعيد)',type:'number',min:1,max:12,step:1,hint:'1 = موعد واحد. يُنشأ كل موعد في نفس اليوم والوقت من الأسابيع التالية.'},
      edit?{k:'status',label:()=>wasAtt&&!UI.draft.attended?'الحالة بعد التراجع عن الحضور':'الحالة',type:'select',show:dd=>!(wasAtt&&dd.attended),options:()=>[{v:'scheduled',l:'لم يُسجَّل بعد'},{v:'missed',l:'لم يحضر'}].concat(a&&a.status==='cancelled'?[{v:'cancelled',l:'محذوف'}]:[])}:{type:'html',html:()=>''},
      {k:'note',label:'ملاحظات',type:'textarea',full:true,rows:2},
      {k:'reason',label:'سبب التصحيح',type:'textarea',full:true,rows:2,show:dd=>edit&&(wasAtt?(changed(dd)||!dd.attended):false),req:dd=>edit&&wasAtt&&(changed(dd)||!dd.attended),hint:'مطلوب لأن الموعد مسجل كحاضر، ولن تُحذف أي حركة مالية.'}
    ],
    info:d=>{
      let h='';if(!validDate(d.date)||!validTime(d.time))return '';
      const c=checkSchedule({patientId:d.patientId,doctorId:d.doctorId,date:d.date,time:d.time,duration:Number(d.duration)||0,excludeId:edit?a.id:null});
      if(!edit&&!d.patientId)return '';

      if(edit&&a.history.length)h+='<div class="note"><b>سجل الموعد:</b><ul class="hlist">'+a.history.slice().reverse().map(x=>'<li><b>'+esc(x.detail)+'</b> · <span class="n">'+x.ts.slice(0,16).replace('T',' ')+'</span>'+(x.reason?' · '+esc(x.reason):'')+'</li>').join('')+'</ul></div>';

      const c=checkSchedule({patientId:d.patientId,doctorId:d.doctorId,date:d.date,time:d.time,duration:Number(d.duration)||0,excludeId:edit?a.id:null});
      if(c.errors.length&&!(edit&&a.status==='cancelled'&&d.status==='cancelled'))return{errors,formErr:c.errors[0]};
      if(edit&&(a.status==='cancelled'||d.status==='cancelled'))return{errors};

        UI.cal.date=d.date;return{msg:'تم حجز '+made+' موعد'+(skipped?' (تخطي '+skipped+' لتعارض مع مواعيد أخرى)':'')+'.'}}
      const reason=(d.reason||'').trim();
      let r=updateAppointment(a.id,{date:d.date,time:d.time,duration:d.duration,schedDoctorId:d.schedDoctorId,doctorId:d.doctorId,note:d.note,fak:!!d.fak},reason);
      if(!r.ok)return{error:r.error};

      if(cur.status==='attended'&&!d.attended){const u=unattendCore(a.id,{reason,newStatus:d.status==='missed'?'missed':'scheduled'});if(!u.ok)return{error:u.error};return{msg:u.msg}}
      if(cur.status!=='attended'&&d.attended){const u=attendCore(a.id,{});if(!u.ok)return{error:u.error};return{msg:u.msg,kind:u.dup?'warn':''}}
      if(cur.status!=='attended'&&d.status!==cur.status){const u=setApptStatus(a.id,d.status,reason);if(!u.ok)return{error:u.error}}
      return{msg:r.nochange?'لا توجد تغييرات.':r.msg};

function allMonthsList(){const s=new Set();for(const r of S.daily||[])s.add(r.date.slice(0,7));for(const t of S.ledger)if(t.type==='payment')s.add(t.date.slice(0,7));for(const x of S.sessions)s.add(x.date.slice(0,7));return Array.from(s).sort()}
function monthNums(ym){
  const R=Math.round,inM=d=>d.slice(0,7)===ym,sum=(a,k)=>a.reduce((x,r)=>x+r[k],0);
  const off=(S.monthly||[]).find(o=>o.m===ym),days=(S.daily||[]).filter(r=>inM(r.date)),exps=(S.expenses||[]).filter(r=>inM(r.date)),exams=(S.exams||[]).filter(r=>inM(r.date)&&r.kind!=='other');
  let cash,insta,exp,exam;
  if(off){cash=off.cash;insta=off.insta;exp=off.exp;exam=off.exam}
  else if(days.length){cash=sum(days,'cash');insta=sum(days,'insta');exp=sum(days,'expenses');exam=sum(days,'exam')}
  else{cash=S.ledger.reduce((x,t)=>x+(t.status==='received'&&t.type==='payment'&&inM(t.date)?t.amount:0),0);insta=0;exp=sum(exps,'amount');exam=sum(exams,'amount')}
  const dm=new Map();for(const s of S.sessions){if(s.status!=='active'||!inM(s.date)||!IDX.pat.has(s.patientId))continue;dm.set(s.doctorId,(dm.get(s.doctorId)||0)+sessionComp(s).doctor)}
  let doc=0;for(const v of dm.values())doc+=R(v);
  cash=R(cash);insta=R(insta);exp=R(exp);exam=R(exam);
  return{income:cash+insta,exp,doc,exam,net:cash+insta-exp-doc};
}

/* ---- debtors: owes the center after half of the sessions ---- */
function debtInfo(p){
  const d=pdOf(p.id);
  if(!p||p.category==='free'||d.status==='free'||!(d.outstanding>0))return null;
  const half=d.total>0&&d.completed*2>=d.total;
  return{d,half,pct:d.total>0?Math.min(100,Math.round(d.completed/d.total*100)):0};
}

    statCard('أجر الجلسات المجانية',money(z.freeComp),z.freeSessions+' جلسة')+statCard('تكلفة المجاني على المركز',money(z.freeCost),'مصروف منفصل')+statCard('إجمالي أجور الأطباء',money(z.doctorComp))+statCard('المدفوع للأطباء',money(z.payoutsPaid))+statCard('المتبقي للأطباء',money(z.owedAll),'حتى الآن')+statCard('صافي نتيجة المركز',money(z.net),'بعد المصروفات وأجور الأطباء',true)+'</div>';

    show.map(r=>'<tr class="'+(r.status==='معكوسة'?'r-can':'')+'"><td class="n">'+r.id+'</td><td>'+dfmt(r.date)+(r.time?' '+tfmt(r.time):'')+'</td><td><button class="link" data-act="openPanel" data-id="'+r.patientId+'">'+esc(patName(r.patientId))+'</button><span class="idc">'+r.patientId+'</span></td><td>'+TX_L[r.type]+'</td><td class="c">'+(r.kind==='tx'?money(r.cash):'—')+'</td><td class="c">'+(r.basis==null?'—':money(r.basis)+(r.rate?' <span class="muted sm-t">× '+Math.round(r.rate*100)+'%</span>':''))+'</td><td class="c">'+(r.doctorComp==null?'—':money(r.doctorComp))+'</td><td class="c">'+(r.center==null?'—':money(r.center))+'</td><td>'+(r.doctorId?esc(docName(r.doctorId)):'—')+'</td><td>'+esc(r.method||'—')+'</td><td>'+esc(r.status)+'</td><td class="notes" style="max-width:260px" title="'+esc(r.related+' '+r.note)+'">'+esc(r.related)+(r.note?' · '+esc(r.note):'')+'</td></tr>').join('')+'</tbody></table></div>':empty('لا توجد حركات مطابقة','غيّر التصفية أو سجّل مدفوعات وجلسات.'))+'</section>';

}

/* ---------- reports ---------- */
function reportsHTML(){
  const VR=visibleReports();const r=VR.find(x=>x.id===UI.rep.id)||VR[0],f=UI.rep;
  const out=runReport(r.id,f);
  let h='<div class="page-head"><div><h1>التقارير</h1><p class="muted">اختر تقريراً، حدّد التصفية، ثم صدّره. التصدير يطابق ما تراه في الجدول.</p></div><div class="acts"><button class="btn" data-act="expRep">'+ic('down')+' تصدير CSV</button></div></div>';
  h+='<div class="rep-sel">'+VR.map(x=>'<button data-act="repPick" data-id="'+x.id+'" aria-pressed="'+(x.id===r.id)+'">'+x.title+'</button>').join('')+'</div>';
  h+='<section class="card"><h2>'+r.title+'</h2><div class="toolbar">'+
    (r.filters.includes('date')?'<label class="fld"><span class="hint">اليوم</span><input class="inp" type="date" data-ch="rep" data-k="date" id="rep-date" value="'+f.date+'"></label>':'')+
    (r.filters.includes('range')?'<label class="fld"><span class="hint">من تاريخ</span><input class="inp" type="date" data-ch="rep" data-k="from" id="rep-from" value="'+f.from+'"></label><label class="fld"><span class="hint">إلى تاريخ</span><input class="inp" type="date" data-ch="rep" data-k="to" id="rep-to" value="'+f.to+'"></label>':'')+
    (r.filters.includes('doctor')?'<label class="fld"><span class="hint">الطبيب</span><select class="sel" data-ch="rep" data-k="doctor" id="rep-doctor"><option value="">كل الأطباء</option>'+S.doctors.map(d=>'<option value="'+d.id+'"'+(f.doctor===d.id?' selected':'')+'>'+esc(d.name)+'</option>').join('')+'</select></label>':'')+
    '<button class="btn" data-act="clearRep" style="align-self:flex-end">مسح</button></div>';
  h+=out.rows.length?'<p class="hint">'+out.rows.length+' صف</p><div class="tw"><table class="xl tight" style="min-width:'+Math.max(640,out.head.length*130)+'px"><thead><tr>'+out.head.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+
    out.rows.slice(0,500).map(row=>'<tr>'+row.map(v=>'<td'+(typeof v==='number'?' class="num"':'')+'>'+(typeof v==='number'?'<span class="n">'+nfmt(v)+'</span>':esc(v))+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'+(out.rows.length>500?'<p class="pagenote">يعرض أول 500 صف. التصدير يشمل الكل.</p>':''):empty('لا توجد بيانات لهذا التقرير','غيّر التصفية أو التاريخ.');
  return h+'</section>';
}

/* ---------- settings ---------- */
function settingsHTML(){
  const s=S.settings,demoP=S.patients.filter(p=>p.demo).length,realP=S.patients.length-demoP,fr=s.free;
  const dayBox=(i)=>'<label><input type="checkbox" data-sd="'+i+'"'+(s.workDays.includes(i)?' checked':'')+'> '+WD[i]+'</label>';
  if(!canDo('admin'))return '<div class="page-head"><div><h1>حسابي</h1></div></div>'+myAccountCard();
  return '<div class="page-head"><div><h1>الإعدادات</h1></div></div>'+
  '<div class="note warn"><b>تنبيه أمان:</b> هذا نموذج تجريبي يعمل داخل المتصفح ويحفظ البيانات على هذا الجهاز فقط، وليس نظاماً آمناً لبيانات المرضى الحقيقية. للاستخدام الفعلي يلزم تسجيل دخول وصلاحيات حسب الدور وقاعدة بيانات مؤمّنة ونسخ احتياطي منتظم.</div>'+
  '<section class="card"><h2>بيانات المركز</h2><div class="fg"><label class="fld"><span class="lbl">اسم المركز</span><input class="inp" id="set-center" value="'+esc(S.center)+'" maxlength="60"></label></div><div><button class="btn primary" data-act="saveCenter">حفظ</button></div></section>'+
  '<section class="card"><h2>ساعات العمل والمواعيد</h2><div class="fg"><label class="fld"><span class="lbl">بداية الدوام</span><input class="inp" type="time" id="set-start" value="'+s.hours.start+'"></label><label class="fld"><span class="lbl">نهاية الدوام</span><input class="inp" type="time" id="set-end" value="'+s.hours.end+'"></label>'+
  '<label class="fld"><span class="lbl">مدة الموعد / الفترة الثابتة (دقيقة)</span><input class="inp" type="number" id="set-slot" min="15" step="5" value="'+s.slot+'"></label><div class="fld full"><span class="lbl">أيام العمل الافتراضية</span><div class="days">'+WEEK_ORDER.map(dayBox).join('')+'</div><span class="hint">تُستخدم للأطباء الجدد. لكل طبيب أيام وساعات خاصة به من صفحته.</span></div></div>'+
  '<div class="note">تغيير مدة الفترة أو الساعات لا يغيّر المواعيد الموجودة، ويؤثر على الفترات المعروضة في الحجز الجديد.</div><div><button class="btn primary" data-act="saveHours">حفظ</button></div></section>'+
  
  '<section class="card"><h2>نسخة احتياطية واستعادة</h2><p class="muted">صدّر كل البيانات كملف JSON واحفظه في مكان آمن، أو استعد نسخة سابقة. الاستعادة تستبدل البيانات الحالية.</p><div class="mf"><button class="btn" data-act="expBackup">'+ic('down',16)+' تصدير نسخة احتياطية</button><button class="btn" data-act="impBackup">استعادة من نسخة</button></div></section>'+
  '<section class="card"><h2>البيانات التجريبية والفعلية</h2><div class="mini"><div>مرضى تجريبيون<b>'+demoP+'</b></div><div>مرضى فعليون<b>'+realP+'</b></div></div><p class="muted">المرضى التجريبيون عليهم علامة «تجريبي». حذف التجريبي لا يمس المرضى الذين أضفتهم أنت ولا الأطباء والباقات.</p>'+
  '<div class="mf"><button class="btn danger" data-act="removeDemo">حذف البيانات التجريبية فقط</button><button class="btn danger" data-act="resetAll">إعادة تحميل بيانات المركز الأصلية</button></div></section>'+
  '<section class="card"><h2>التخزين</h2><p>'+(SAVE_OK?'<span class="b paid">التخزين يعمل</span>':'<span class="b unpaid">التخزين غير متاح في هذا المتصفح</span>')+'</p><p class="muted">الإصدار 2 · '+S.patients.length+' مريض · '+S.appointments.length+' موعد · '+S.sessions.length+' جلسة · '+S.ledger.length+' معاملة · '+S.audit.length+' تعديل مسجل.</p></section>';
}

/* ---------- patient notes: illness / absence / attendance / money ---------- */
const NCAT={illness:'المرض / الحالة',absence:'الغياب',attendance:'الحضور',money:'المالية'};
function noteCats(){return Object.keys(NCAT).filter(k=>k!=='money'||isFin())}
function patientNotes(p){return (p.noteLog||[]).filter(n=>n.cat!=='money'||isFin()).slice().sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:a.ts<b.ts?1:-1)}
function patientNotesHTML(p){
  const all=patientNotes(p),cat=(UI.panel&&UI.panel.ncat)||'',list=cat?all.filter(n=>n.cat===cat):all;
  const cnt=k=>all.filter(n=>n.cat===k).length;
  let h='<div class="psec" id="pnotes"><h3><span>ملاحظات المريض ('+all.length+')</span><button class="btn sm primary" data-act="addPNote" data-id="'+p.id+'">'+ic('plus',14)+' إضافة ملاحظة</button></h3>';
  h+='<div class="nfilter"><button class="tab sm" data-act="pNoteCat" data-c="" aria-selected="'+(!cat)+'">الكل ('+all.length+')</button>'+noteCats().map(k=>'<button class="tab sm" data-act="pNoteCat" data-c="'+k+'" aria-selected="'+(cat===k)+'">'+NCAT[k]+' ('+cnt(k)+')</button>').join('')+'</div>';
  h+=list.length?'<ul class="list">'+list.map(n=>'<li><span class="m"><b><span class="nc '+n.cat+'">'+NCAT[n.cat]+'</span> '+dfmt(n.date)+'</b><span class="ntext">'+esc(n.text)+'</span><span class="muted sm-t">'+esc(n.user||'')+(n.edited?' · عُدّلت':'')+'</span></span><span class="mf"><button class="ib" data-act="editPNote" data-id="'+p.id+'" data-nid="'+n.id+'" title="تعديل" aria-label="تعديل الملاحظة">'+ic('edit',16)+'</button><button class="ib del" data-act="delPNote" data-id="'+p.id+'" data-nid="'+n.id+'" title="حذف" aria-label="حذف الملاحظة">'+ic('trash',16)+'</button></span></li>').join('')+'</ul>':'<p class="hint">لا توجد ملاحظات'+(cat?' في هذا القسم':'')+' بعد. اضغط «إضافة ملاحظة» لتسجيل المرض أو الغياب أو الحضور'+(isFin()?' أو المالية':'')+'.</p>';
  return h+'</div>';
}
function savePatientNote(pid,nid0,d){
  const p=patById(pid);if(!p)return;if(!Array.isArray(p.noteLog))p.noteLog=[];
  const text=String(d.text).trim();
  if(nid0){const n=p.noteLog.find(x=>x.id===nid0);if(!n)return;if(n.cat==='money'&&!isFin())return;
    const was=n.text,wasCat=n.cat;n.cat=d.cat;n.date=d.date;n.text=text;n.edited=nowISO();
    logA('patient',pid,'تعديل ملاحظة ('+NCAT[n.cat]+')',n.cat==='money'||wasCat==='money'?[]:[{field:'الملاحظة',from:was.slice(0,60),to:text.slice(0,60)}],'',pid)}
  else{const n={id:nid2(),cat:d.cat,date:d.date,text:text,user:ACTOR,ts:nowISO()};p.noteLog.push(n);
    logA('patient',pid,'إضافة ملاحظة ('+NCAT[n.cat]+')',n.cat==='money'?[]:[{field:'الملاحظة',from:'',to:text.slice(0,60)}],'',pid)}
  commit();
}
function nid2(){return nid('pn')}
function openPNoteForm(pid,nid0){
  const p=patById(pid);if(!p)return;const ex=nid0?(p.noteLog||[]).find(n=>n.id===nid0):null;
  if(ex&&ex.cat==='money'&&!isFin()){toast(DENY,'bad');return}
  openForm({title:(ex?'تعديل ملاحظة — ':'ملاحظة جديدة — ')+p.name,submit:ex?'حفظ التعديل':'حفظ الملاحظة',
    draft:{cat:ex?ex.cat:((UI.panel&&UI.panel.ncat&&NCAT[UI.panel.ncat]&&noteCats().includes(UI.panel.ncat))?UI.panel.ncat:'illness'),date:ex?ex.date:todayISO(),text:ex?ex.text:''},
    fields:d=>[{k:'cat',label:'نوع الملاحظة',type:'select',req:true,options:()=>noteCats().map(k=>({v:k,l:NCAT[k]}))},{k:'date',label:'التاريخ',type:'date',req:true},
      {k:'text',label:'الملاحظة',type:'textarea',rows:5,full:true,req:true,noMax:true,hint:'مثال: المرض، تاريخ الغياب وسببه، ملاحظة عن الحضور، أو ما يخص المبالغ.'}],
    validate(d){const e={};if(!validDate(d.date))e.date='تاريخ غير صحيح.';if(!String(d.text||'').trim())e.text='اكتب الملاحظة.';if(d.cat==='money'&&!isFin())e.cat='ليست لديك صلاحية للملاحظات المالية.';return{errors:e}},
    onSave(d){savePatientNote(pid,nid0,d);return{msg:ex?'تم تعديل الملاحظة.':'تمت إضافة الملاحظة.'}}});
}
function patientBracesHTML(p){
  const l=(S.braces||[]).filter(b=>b.patientId===p.id);if(!l.length)return '';
  return '<div class="psec"><h3><span>Braces ('+l.length+')</span><button class="btn sm" data-act="nav" data-v="braces">فتح صفحة Braces</button></h3><ul class="list">'+l.map(b=>'<li><span class="m"><b>'+esc(b.type)+(b.size?' · '+esc(b.size):'')+'</b><span class="muted sm-t">'+dfmt(b.date)+' · '+BR_ST[b.status]+(isFin()?' · السعر '+moneyT(num(b.price))+' · المدفوع '+moneyT(brPaid(b))+' · المتبقي '+moneyT(brOut(b)):'')+'</span></span></li>').join('')+'</ul></div>';
}

/* ---------- doctor attendance: presence records (+ existing absence records) ---------- */
function hoursTxt(a,b){const m=toMin(b)-toMin(a);return m>0?Math.floor(m/60)+' س '+(m%60)+' د':''}
function presSide(){return CUR&&CUR.role==='doctor'?'doc':CUR&&CUR.role==='reception'?'sec':'both'}
function presApply(r,side,inT,outT){
  if(r.in&&!r.dIn&&!r.sIn&&!r.pend){r.dIn=r.sIn=r.in;if(r.out){r.dOut=r.sOut=r.out}}
  if(inT!==undefined){if(side!=='sec')r.dIn=inT;if(side!=='doc')r.sIn=inT}

});
document.addEventListener('click',e=>{
  const b=e.target.closest&&e.target.closest('.lg-go');if(!b)return;
  if(e.target.closest('#lf')){e.preventDefault();doLoginForm()}
  else if(e.target.closest('#fp')){e.preventDefault();doForcePw()}
},true);
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(e.target&&e.target.closest&&e.target.closest('#lf')){e.preventDefault();doLoginForm()}
  else if(e.target&&e.target.closest&&e.target.closest('#fp')){e.preventDefault();doForcePw()}
},true);
['click','keydown','input','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{if(CUR)idleReset()},{passive:true}));

/* ---------- startup: sign-in required ---------- */
const info=loadState();UI.note=info.note;
usersLoad();
if(sessionResume())afterLogin();else showLogin();

})();
</script>
</body>
</html>
